<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0d0f14" />
		<meta name="mobile-web-app-capable" content="yes" />
		<title>chat-agent</title>
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<script src="/vendor/highlight-core.js" type="module"></script>
		<link id="hljs-theme" rel="stylesheet" href="/vendor/highlight-github-dark.css" />
		<link rel="stylesheet" href="/style.css" />
	</head>
	<body>
		<div id="app">
			<aside id="panel" aria-label="Conversations">
				<div class="panel-head">
					<span class="brand">chat-agent</span>
					<button id="new-chat" title="New conversation">＋</button>
				</div>
				<ul id="conv-list"></ul>
			</aside>
			<div id="scrim" hidden></div>
			<main id="chat">
				<header id="chat-head">
					<button id="panel-toggle" title="Toggle chat list" aria-label="Toggle chat list">☰</button>
					<div id="chat-title">New Chat</div>
					<button id="think-btn" class="on" title="Thinking mode: on" aria-label="Toggle thinking mode">🧠</button>
					<button id="export-btn" title="Export conversation as markdown" aria-label="Export markdown">⤓</button>
				</header>
				<div id="chat-inner">
					<div id="messages" tabindex="0"></div>
					<footer id="composer">
						<div id="stats"></div>
						<div id="input-row">
							<textarea id="input" rows="1" placeholder="Message…" enterkeyhint="send"></textarea>
							<button id="send" title="Send">➤</button>
						</div>
					</footer>
				</div>
				<div id="chat-controls">
					<input id="width-slider" type="range" min="20" max="100" step="1" value="100" aria-label="Chat width" />
					<button id="theme-toggle" aria-label="Toggle color theme" title="Toggle theme">🌙</button>
				</div>
			</main>
		</div>
		<script type="module" src="/lib/app.js"></script>
	</body>
</html>
